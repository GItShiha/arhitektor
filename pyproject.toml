[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arhitektor"
version = "0.1.0"
description = "Локальная мастерская писателя"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "SQLAlchemy>=2.0,<3", "alembic>=1.14,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.9"]

[project.scripts]
arhitektor = "arhitektor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100

[tool.setuptools.package-data]
arhitektor = ["infrastructure/migrations/script.py.mako"]
